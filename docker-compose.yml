# ==============================================================================
# SolarSense — Multi-Container Compose Specification
# ==============================================================================
version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: solarsense-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
      - DATABASE_PATH=data/solarsense.db
      - MODEL_PATH=backend/models/solar_xgb.joblib
      - SCHEDULER_ENABLED=true
      - EMAIL_ENABLED=false
      - WHATSAPP_ENABLED=false
    volumes:
      # Shared persistent storage for SQLite database and raw weather cache
      - ./data:/app/data
      # Shared persistent storage for trained XGBoost model artifact
      - ./backend/models:/app/backend/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: solarsense-frontend
    ports:
      - "8501:8501"
    environment:
      - PYTHONPATH=/app
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: solarsense-network


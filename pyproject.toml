[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N806", "N999", "RUF001", "RUF002", "RUF003"]  # Allow uppercase X, Streamlit page names, Unicode/emoji strings

[tool.ruff.lint.per-file-ignores]
"frontend/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

